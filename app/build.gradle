apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    namespace "com.shotgun84.meowdokuoverlay"
    compileSdk 34

    defaultConfig {
        applicationId "com.shotgun84.meowdokuoverlay"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    testImplementation "junit:junit:4.13.2"
}
